# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Inject Git hash into footer
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DEPLOY_TIME="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          sed -i "s/__APP_GIT_HASH_VALUE__/${SHORT_SHA}/g" index.html
          sed -i "s/__APP_DEPLOY_TIME_VALUE__/${DEPLOY_TIME}/g" index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Wait for artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            artifact_count="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq '[.artifacts[] | select(.name == "github-pages")] | length'
            )" || artifact_count=0
            if [ "${artifact_count}" -gt 0 ]; then
              echo "Pages artifact is available."
              exit 0
            fi
            echo "Pages artifact is not visible yet; retrying (${attempt}/12)."
            sleep 5
          done
          echo "::error::Pages artifact was not available after 60 seconds."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
